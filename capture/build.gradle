plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}
android {
    namespace 'com.packetcapture.capture'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 26
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    kotlinOptions { jvmTarget = '11' }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation project(':core')
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation platform('io.netty:netty-bom:4.1.138.Final')
    implementation 'io.netty:netty-codec-http'
    implementation 'io.netty:netty-codec-http2'
    implementation 'io.netty:netty-codec-socks'
    implementation 'io.netty:netty-handler'
    implementation 'io.netty:netty-handler-proxy'
    implementation 'org.conscrypt:conscrypt-android:2.7.0'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.83'
    testImplementation 'junit:junit:4.13.2'
}
